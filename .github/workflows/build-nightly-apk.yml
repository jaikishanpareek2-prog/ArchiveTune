name: Build nightly APK
on:
  workflow_dispatch:
  push:
    branches: [ 'ipv4-fallback' ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: python scripts/generate_translation_contributors.py
      - uses: actions/setup-java@v6
        with:
          java-version: 27
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - run: chmod +x gradlew
      - name: Generate debug.keystore
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkey -v \
            -keystore ~/.android/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA \
            -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Build nightly APK
        run: ./gradlew --console=plain assembleGmsMobileUniversalNightly
      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0"
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -ipath '*nightly*' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::No nightly APK found"
            find app/build/outputs/apk -type f
            exit 1
          fi
          mkdir -p signed
          "$BT/zipalign" -f -P 16 4 "$APK" signed/aligned.apk
          "$BT/apksigner" sign --ks ~/.android/debug.keystore \
            --ks-key-alias androiddebugkey --ks-pass pass:android \
            --key-pass pass:android \
            --out signed/archivetune-nightly.apk signed/aligned.apk
          rm -f signed/aligned.apk signed/*.idsig
          "$BT/apksigner" verify signed/archivetune-nightly.apk
      - uses: actions/upload-artifact@v4
        with:
          name: archivetune-nightly-apk
          path: signed/archivetune-nightly.apk
          if-no-files-found: error
